# One workflow.
#
# Every push and pull request runs the gates, builds the wheel (pure
# Python, `py3-none-any`: the run's `wheel-any` artifact), and packs the
# terminal UI once on Linux and starts it, to catch what a bundler cannot
# see.
#
# A `v*` tag runs the gates, builds the wheel, and packs the terminal UI
# into one binary per platform, each started and spoken to before it is
# kept. Once all of that is green the wheel and the binaries are published
# as a GitHub release; the wheel to PyPI too, when the repository variable
# PUBLISH_PYPI is "true" (register this workflow as a trusted publisher on
# pypi.org first — owner hoyipyik, repository void-agent, workflow ci.yml,
# environment pypi — then `gh variable set PUBLISH_PYPI --body true`). No
# sdist is published.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

      - name: build the wheel
        run: uv build --wheel

      - name: it ships py.typed and installs into a fresh venv
        run: |
          uv run python -c "import zipfile,glob,sys; w=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(w).namelist(); sys.exit(0 if 'void_agent/py.typed' in names else 'py.typed missing from wheel')"
          uv venv .verify
          uv pip install --python .verify/bin/python dist/*.whl
          .verify/bin/python -c "import void_agent; print(len(void_agent.__all__), 'public names')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-any
          path: dist/*.whl
          if-no-files-found: error

  # The push-time guard for the binary: pack it once on Linux, start it, and
  # speak one MCP round trip to its toolbox — the imports a bundler cannot
  # see break at start, not at build. Tags run the matrix below.
  binary:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: pack
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv run --group build python scripts/pack.py --fetch-ripgrep
      - run: dist/void --help
      - run: uv run python scripts/smoke_toolbox.py dist/void

  # The terminal UI as one binary, one per platform: `dist/void`, packed by
  # `scripts/pack.py` (the same script `make cli-build` runs, so what CI
  # ships is what a checkout builds). Each carries the official `rg` for
  # its platform, pinned by digest in the script: the toolbox searches with
  # it, and a binary that has to find one on the person's PATH is not one
  # binary.
  binaries:
    name: binary · ${{ matrix.asset }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # Two legs depend on runners a repository may not have (arm64 Linux, an
    # Intel Mac): they may fail without holding the release back — the
    # release job checks for the three required binaries by name.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller links against the runner's own libc, so the Linux
          # binary asks for that glibc or newer — 22.04 (2.35) reaches
          # further back than 24.04 does. The `rg` inside is a musl build
          # and asks for nothing.
          - { os: ubuntu-22.04, asset: void-agent-cli-linux-x86_64 }
          - { os: ubuntu-22.04-arm, asset: void-agent-cli-linux-arm64, optional: true }
          # setup-python's Intel build ships an OpenSSL older than the one
          # cryptography's wheel wants, and PyInstaller can carry only one
          # libssl.3.dylib — the packed binary died at start. uv's own
          # Python links OpenSSL statically, so nothing collides.
          - { os: macos-15-intel, asset: void-agent-cli-macos-x86_64, optional: true, python: only-managed }
          - { os: macos-latest, asset: void-agent-cli-macos-arm64 }
          - { os: windows-latest, asset: void-agent-cli-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4

      # setup-python's builds carry conservative deployment targets, which is
      # what the packed binary inherits; `only-system` keeps uv off its own.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: pack
        env:
          UV_PYTHON_PREFERENCE: ${{ matrix.python || 'only-system' }}
        run: uv run --python 3.12 --group build python scripts/pack.py --fetch-ripgrep

      # The imports a bundler cannot see are exactly what breaks here, and
      # they break at start rather than at build: --help walks the whole graph.
      - name: it starts
        shell: bash
        run: |
          binary=dist/void
          [ -f dist/void.exe ] && binary=dist/void.exe
          "$binary" --help

      # …and the toolbox is a mode of the same binary, so it is worth one
      # round trip: initialize, list the tools, and see `search` among them.
      - name: its toolbox answers
        shell: bash
        run: |
          binary=dist/void
          [ -f dist/void.exe ] && binary=dist/void.exe
          uv run python scripts/smoke_toolbox.py "$binary"

      - name: name it for its platform
        shell: bash
        run: |
          mkdir -p out
          if [ -f dist/void.exe ]; then cp dist/void.exe "out/${{ matrix.asset }}";
          else cp dist/void "out/${{ matrix.asset }}"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish the GitHub release
    needs: [python, binaries]
    # `always()` so an optional binary leg that failed does not veto the
    # release; the wheel must have passed, and the required binaries are
    # checked for by name below.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.python.result == 'success'
      && needs.binaries.result != 'cancelled' && needs.binaries.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag names the version; pyproject must agree, or the release lies.
      - name: the version matches the tag
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::pyproject.toml says $version, the tag says ${{ github.ref_name }}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: wheel-any
          path: dist

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: void-agent-cli-*
          merge-multiple: true

      - name: list what is being published
        run: ls -l dist

      - name: the required binaries are here
        run: |
          for required in void-agent-cli-linux-x86_64 void-agent-cli-macos-arm64 void-agent-cli-windows-x86_64.exe; do
            [ -f "dist/$required" ] || { echo "::error::$required was not built"; exit 1; }
          done

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes='**The framework.** `void_agent-*-py3-none-any.whl` is pure Python and installs anywhere. Extras go in brackets: `pip install "void-agent[openai,mcp] @ <wheel url>"`.

          **The terminal UI.** `void-agent-cli-*` is one binary per platform — the UI, the agents, the MCP SDK and ripgrep inside. No Python, nothing to install: download the one for your machine, `chmod +x`, run it. macOS asks once the first time (right-click → Open, or `xattr -d com.apple.quarantine`).'
          # Dispatching this workflow on an existing tag (to publish to PyPI
          # after switching it on, say) meets a release that exists: refresh
          # its assets instead of failing.
          gh release create "$TAG" dist/*.whl dist/void-agent-cli-* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "$notes" \
            || gh release upload "$TAG" dist/*.whl dist/void-agent-cli-* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    name: publish to PyPI
    needs: [python]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-any
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
